spring.application.name=civitaswebapp

# Als SPRING_DATASOURCE_URL niet in de omgeving staat (lokaal), gebruikt hij localhost!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civitas_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civitas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.messages.basename=i18n/messages

# Stripe & Twilio Keys (Lokaal pakt hij de test-waarden, op de server pakt hij civitas.env)
stripe.api-key=${STRIPE_API_KEY:pk_test_12345}
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_12345}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_test_12345}

# Public base URL used to build absolute redirect links (e.g. Stripe Checkout success/cancel).
# On production this MUST be set via the APP_BASE_URL env var to the real HTTPS domain.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Subscription billing: how long an unpaid PENDING charge stays open before it's marked EXPIRED and
# the member becomes eligible to be billed for the current cycle again (see
# SubscriptionBillingProcessor). How often a WhatsApp reminder may be resent for the same still-open
# charge, so a member isn't messaged on every nightly scheduler run.
subscription.billing.pending-grace-period-days=${SUBSCRIPTION_GRACE_DAYS:14}
subscription.billing.reminder-cooldown-days=${SUBSCRIPTION_REMINDER_COOLDOWN_DAYS:3}

twilio.account-sid=${TWILIO_ACCOUNT_SID:AC_test}
twilio.auth-token=${TWILIO_AUTH_TOKEN:test_token}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}

# Twilio Content SIDs (De structuur staat in Git, de echte HX-codes komen uit civitas.env)
twilio.content-sids.payment-link.nl=${TWILIO_SID_PAYMENT_LINK_NL:HX_test_1}
twilio.content-sids.payment-link.en=${TWILIO_SID_PAYMENT_LINK_EN:HX_test_2}
twilio.content-sids.payment-success.nl=${TWILIO_SID_PAYMENT_SUCCESS_NL:HX_test_3}
twilio.content-sids.payment-success.en=${TWILIO_SID_PAYMENT_SUCCESS_EN:HX_test_4}
twilio.content-sids.payment-failed.nl=${TWILIO_SID_PAYMENT_FAILED_NL:HX_test_5}
twilio.content-sids.payment-failed.en=${TWILIO_SID_PAYMENT_FAILED_EN:HX_test_6}
twilio.content-sids.event-planned.nl=${TWILIO_SID_EVENT_PLANNED_NL:HX_test_7}
twilio.content-sids.event-planned.en=${TWILIO_SID_EVENT_PLANNED_EN:HX_test_8}
twilio.content-sids.payment-link.tr=${TWILIO_SID_PAYMENT_LINK_TR:HX_test_9}
twilio.content-sids.payment-success.tr=${TWILIO_SID_PAYMENT_SUCCESS_TR:HX_test_10}
twilio.content-sids.payment-failed.tr=${TWILIO_SID_PAYMENT_FAILED_TR:HX_test_11}
twilio.content-sids.event-planned.tr=${TWILIO_SID_EVENT_PLANNED_TR:HX_test_12}