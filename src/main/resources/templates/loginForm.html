<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login Page</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<main class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-user-shield login-icon"></i>
            <h1 th:text="#{login.heading}">Login</h1>
            <p class="subtitle" th:text="#{login.subtitle}">Please enter your credentials</p>
        </div>

        <div th:if="${errorKey}" class="alert alert-error" id="loginAlertError">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="#{${errorKey}}">Error message</span>
            <button type="button" class="alert-dismiss" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>

        <!-- Session ended because an admin changed this account's role (see UserSessionExpirer) -->
        <div th:if="${param.expired}" class="alert alert-error" id="loginAlertExpired">
            <i class="fas fa-info-circle"></i>
            <span th:text="#{login.expired}">Your session has ended. Please log in again.</span>
            <button type="button" class="alert-dismiss" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>

        <div th:if="${logoutKey}" class="alert alert-success" id="loginAlertSuccess">
            <i class="fas fa-check-circle"></i>
            <span th:text="#{${logoutKey}}">Success message</span>
            <button type="button" class="alert-dismiss" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username" th:text="#{login.label.username}">Username</label>
                <div class="input-with-icon">
                    <span class="input-left-icon">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" th:placeholder="#{login.username.placeholder}"
                           autocomplete="username" autofocus required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" th:text="#{login.label.password}">Password</label>
                <div class="input-with-icon">
                    <span class="input-left-icon">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" th:placeholder="#{login.password.placeholder}"
                           autocomplete="current-password" required>
                    <span class="input-right-icon">
                        <i id="togglePassword" class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                <span th:text="#{login.button.submit}">Login</span>
            </button>

            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
        </form>
    </div>
</main>

<script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);

        togglePassword.classList.toggle('fa-eye');
        togglePassword.classList.toggle('fa-eye-slash');
    });
</script>

</body>
</html>
